name: Israeli VPN
description: >
  Routes the runner's traffic through a WireGuard VPN, because knesset.gov.il
  only answers Israeli IP addresses. Does nothing when no config is given.
inputs:
  config:
    description: Contents of a WireGuard .conf file for an Israeli VPN server
    required: false
    default: ""
runs:
  using: composite
  steps:
    - if: inputs.config != ''
      shell: bash
      env:
        WG_CONF: ${{ inputs.config }}
      run: |
        sudo apt-get update -qq && sudo apt-get install -y -qq wireguard-tools > /dev/null
        # DNS lines need resolvconf, which the runner lacks; the runner's own DNS works fine.
        printf '%s\n' "$WG_CONF" | grep -viE '^[[:space:]]*DNS[[:space:]]*=' | sudo tee /etc/wireguard/wg0.conf > /dev/null
        sudo chmod 600 /etc/wireguard/wg0.conf
        sudo wg-quick up wg0
        country="$(curl -fsS --max-time 15 https://ipinfo.io/country || echo unknown)"
        echo "VPN up; traffic now exits in: $country"
        if [ "$country" != "IL" ]; then echo "::warning::VPN exit country is $country, not IL; the Knesset will likely block it."; fi
