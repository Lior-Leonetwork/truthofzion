name: Israeli VPN
description: >
  Routes the runner's traffic through a VPN, because knesset.gov.il only
  answers Israeli IP addresses. Supports WireGuard, or OpenVPN (e.g. NordVPN
  manual setup / dedicated IP). Does nothing when no config is given.
inputs:
  wireguard:
    description: Contents of a WireGuard .conf file for an Israeli server
    required: false
    default: ""
  openvpn:
    description: Contents of an OpenVPN .ovpn file for an Israeli server
    required: false
    default: ""
  openvpn-auth:
    description: OpenVPN credentials, username on the first line and password on the second
    required: false
    default: ""
runs:
  using: composite
  steps:
    - if: inputs.wireguard != ''
      shell: bash
      env:
        WG_CONF: ${{ inputs.wireguard }}
      run: |
        sudo apt-get update -qq && sudo apt-get install -y -qq wireguard-tools > /dev/null
        # DNS lines need resolvconf, which the runner lacks; the runner's own DNS works fine.
        printf '%s\n' "$WG_CONF" | grep -viE '^[[:space:]]*DNS[[:space:]]*=' | sudo tee /etc/wireguard/wg0.conf > /dev/null
        sudo chmod 600 /etc/wireguard/wg0.conf
        sudo wg-quick up wg0

    - if: inputs.wireguard == '' && inputs.openvpn != ''
      shell: bash
      env:
        OVPN_CONF: ${{ inputs.openvpn }}
        OVPN_AUTH: ${{ inputs.openvpn-auth }}
      run: |
        sudo apt-get update -qq && sudo apt-get install -y -qq openvpn > /dev/null
        dir="$(mktemp -d)"
        printf '%s\n' "$OVPN_CONF" > "$dir/client.ovpn"
        printf '%s\n' "$OVPN_AUTH" | tr -d '\r' > "$dir/auth.txt"
        chmod 600 "$dir/auth.txt"
        sudo openvpn --config "$dir/client.ovpn" --auth-user-pass "$dir/auth.txt" --auth-nocache \
          --daemon --log /tmp/openvpn.log --writepid /tmp/openvpn.pid
        for i in $(seq 1 45); do
          if sudo grep -q "Initialization Sequence Completed" /tmp/openvpn.log; then break; fi
          if sudo grep -qE "AUTH_FAILED|Exiting due to fatal error" /tmp/openvpn.log; then break; fi
          sleep 1
        done
        if ! sudo grep -q "Initialization Sequence Completed" /tmp/openvpn.log; then
          echo "::error::OpenVPN did not connect. Last log lines:"
          sudo tail -n 15 /tmp/openvpn.log | grep -viE "auth|password|user" || true
          exit 1
        fi
        rm -f "$dir/auth.txt"

    - if: inputs.wireguard != '' || inputs.openvpn != ''
      shell: bash
      run: |
        country="$(curl -fsS --max-time 15 https://ipinfo.io/country || echo unknown)"
        echo "VPN up; traffic now exits in: $country"
        if [ "$country" != "IL" ]; then echo "::warning::VPN exit country is $country, not IL; the Knesset will likely block it."; fi
