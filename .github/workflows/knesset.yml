name: Knesset votes

# Daily, fully automatic: pull new votes from the Knesset's official data,
# have Claude summarise each bill from its official explanatory notes (quotes
# verified in code), publish both, and redeploy the site.
# Only "said one thing, voted the opposite" findings go to editors, as draft
# cases in a pull request: they accuse named people and need the right of reply.
on:
  schedule:
    - cron: "17 3 * * *" # 06:17 Israel time
  workflow_dispatch:
    inputs:
      max_votes:
        description: Max votes to ingest this run
        default: "400"
      from:
        description: First run only - earliest vote date (YYYY-MM-DD). Default is two years back.
        default: ""
      max_summaries:
        description: Max votes to summarise and publish this run
        default: "40"
      max_statement_checks:
        description: Max key votes to check members' public statements against
        default: "3"

permissions:
  contents: write
  pull-requests: write

concurrency: knesset

jobs:
  publish:
    # knesset.gov.il only answers Israeli IP addresses. Set the repository
    # variable KNESSET_RUNNER to a self-hosted runner label (e.g. "israel")
    # to run these jobs on a machine in Israel.
    runs-on: ${{ vars.KNESSET_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: ./.github/actions/israel-vpn
        with:
          wireguard: ${{ secrets.KNESSET_WIREGUARD_CONF }}
          openvpn: ${{ secrets.KNESSET_OPENVPN_CONF }}
          openvpn-auth: ${{ secrets.KNESSET_OPENVPN_AUTH }}
      - run: npm ci
      - name: Ingest official votes
        run: npm run knesset:ingest -- --max-votes "${{ inputs.max_votes || '400' }}" ${{ inputs.from && format('--from {0}', inputs.from) || '' }}
        env:
          KNESSET_HTTP_PROXY: ${{ secrets.KNESSET_HTTP_PROXY }}
      - name: Summarise and publish with Claude
        run: npm run knesset:analyze -- --publish --max "${{ inputs.max_summaries || '40' }}"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KNESSET_HTTP_PROXY: ${{ secrets.KNESSET_HTTP_PROXY }}
      - run: npm run validate
      - run: npm test
      - name: Publish
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/knesset
          if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
          git commit -m "Knesset votes and summaries: $(date -u +%F)"
          # main may have moved during a long run (e.g. an editor's commit); replay on top.
          git pull --rebase origin main
          git push origin HEAD:main
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      # Vercel may not deploy commits authored by the Actions bot (Hobby plan),
      # so ask it to rebuild explicitly. Secret: a Vercel deploy hook URL.
      - name: Redeploy the site
        if: steps.commit.outputs.pushed == 'true' && env.VERCEL_DEPLOY_HOOK != ''
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: curl -fsS -X POST "$VERCEL_DEPLOY_HOOK" > /dev/null && echo "Vercel redeploy requested."

  statements:
    needs: publish
    runs-on: ${{ vars.KNESSET_RUNNER || 'ubuntu-latest' }}
    env:
      BRANCH: ai/knesset-drafts
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: ./.github/actions/israel-vpn
        with:
          wireguard: ${{ secrets.KNESSET_WIREGUARD_CONF }}
          openvpn: ${{ secrets.KNESSET_OPENVPN_CONF }}
          openvpn-auth: ${{ secrets.KNESSET_OPENVPN_AUTH }}
      - run: npm ci
      # With an open review pull request, build on its branch and never
      # force-push it: editors may have edited drafts there. Without one, any
      # leftover branch is stale (closed or merged), so start fresh from main.
      - name: Check out the review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            git checkout -B "$BRANCH" "origin/$BRANCH"
            git merge --no-edit origin/main
          else
            git checkout -B "$BRANCH" origin/main
            echo "FRESH_BRANCH=1" >> "$GITHUB_ENV"
          fi
      - name: Check members' public statements against key votes
        run: npm run knesset:statements -- --max "${{ inputs.max_statement_checks || '3' }}"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KNESSET_HTTP_PROXY: ${{ secrets.KNESSET_HTTP_PROXY }}
      - run: npm run validate
      - run: npm test
      - name: Open or update the review pull request
        run: |
          git add -A content data/knesset/statements-checked.json
          if git diff --cached --quiet && git diff --quiet origin/main HEAD -- content; then
            echo "No findings to review."; exit 0
          fi
          git diff --cached --quiet || git commit -m "AI findings: said one thing, voted the opposite $(date -u +%F)"
          if [ -n "${FRESH_BRANCH:-}" ]; then git push --force origin "$BRANCH"; else git push origin "$BRANCH"; fi
          gh label create ai-draft --color D9A321 --description "Drafted by AI, needs editor review" --force
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base main --head "$BRANCH" --label ai-draft \
              --title "AI findings for review: said one thing, voted the opposite" \
              --body-file .github/ai-draft-pr.md
          fi
