name: Knesset probe

# Manual diagnostic: prints the raw responses of the Knesset's data services.
on: workflow_dispatch

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run knesset:probe
        env:
          KNESSET_HTTP_PROXY: ${{ secrets.KNESSET_HTTP_PROXY }}
