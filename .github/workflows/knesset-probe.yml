name: Knesset probe

# Manual diagnostic: prints the raw responses of the Knesset's data services.
on: workflow_dispatch

permissions:
  contents: read

jobs:
  probe:
    runs-on: ${{ vars.KNESSET_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: ./.github/actions/israel-vpn
        with:
          wireguard: ${{ secrets.KNESSET_WIREGUARD_CONF }}
          openvpn: ${{ secrets.KNESSET_OPENVPN_CONF }}
          openvpn-auth: ${{ secrets.KNESSET_OPENVPN_AUTH }}
      - run: npm ci
      - run: npx tsx scripts/probe-elections.ts
